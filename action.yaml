---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# rust-audit-action
name: "🦀 Rust Dependency Audit"
# yamllint disable-line rule:line-length
description: "Audits a Rust project's dependencies for known vulnerabilities with cargo-audit, and optionally cargo-deny"
# Inputs are checked before any tool installs. cargo-audit then reads
# Cargo.lock against the RustSec advisory database; cargo-deny, when
# enabled, applies the project's deny.toml. Nothing gets compiled. The
# reports upload as an artefact, after a failed audit too.

inputs:
  # Optional
  path_prefix:
    description: "Directory holding the Rust project, inside the workspace"
    required: false
    default: "."
  manifest_path:
    description: "Path to the project's Cargo.toml, relative to path_prefix"
    required: false
    default: "Cargo.toml"
  toolchain:
    # yamllint disable-line rule:line-length
    description: "rustup channel to use; empty uses the one the project selects"
    required: false
    default: ""
  lockfile_required:
    # yamllint disable-line rule:line-length
    description: "Fail when Cargo.lock is missing ('true'), rather than generating one with a warning"
    required: false
    default: "false"
  ignore_vulns:
    # yamllint disable-line rule:line-length
    description: "RUSTSEC advisory IDs for cargo-audit to ignore, whitespace-separated"
    required: false
    default: ""
  allow_list_path:
    # yamllint disable-line rule:line-length
    description: "File of RUSTSEC IDs to ignore, one per line with '#' comments, relative to path_prefix"
    required: false
    default: ""
  deny_warnings:
    # yamllint disable-line rule:line-length
    description: "cargo-audit warning kinds that fail the run: any of 'unmaintained unsound yanked'"
    required: false
    default: ""
  deny_enabled:
    description: "Also run cargo-deny ('true'/'false')"
    required: false
    default: "false"
  deny_checks:
    # yamllint disable-line rule:line-length
    description: "cargo-deny checks to run: any of 'advisories bans licenses sources'"
    required: false
    default: "advisories bans licenses sources"
  cargo_audit_version:
    description: "cargo-audit version to install"
    required: false
    default: "0.22.2"
  cargo_deny_version:
    description: "cargo-deny version to install, when deny_enabled is 'true'"
    required: false
    default: "0.20.2"
  permit_fail:
    # yamllint disable-line rule:line-length
    description: "Report success, with a warning, even when the audit fails ('true'/'false')"
    required: false
    default: "false"
  summary:
    description: "Write the audit results to the job summary ('true'/'false')"
    required: false
    default: "true"
  artefact_upload:
    # yamllint disable-line rule:line-length
    description: "Upload the reports as a workflow artefact, after a failed audit too ('true'/'false')"
    required: false
    default: "true"
  artefact_name:
    # yamllint disable-line rule:line-length
    description: "Name of the report artefact; give each call in a workflow run its own"
    required: false
    default: "rust-audit-results"
  artefact_path:
    # yamllint disable-line rule:line-length
    description: "Empty or absent directory for the reports, relative to path_prefix; empty means a fresh one under RUNNER_TEMP"
    required: false
    default: ""

outputs:
  toolchain:
    description: "Toolchain used: a rustup channel, a path, or empty"
    value: ${{ steps.audit.outputs.toolchain }}
  toolchain_kind:
    # yamllint disable-line rule:line-length
    description: "How the action chose the toolchain: 'channel', 'path' or 'none'"
    value: ${{ steps.audit.outputs.toolchain_kind }}
  cargo_version:
    description: "Version of the cargo that ran the audit"
    value: ${{ steps.audit.outputs.cargo_version }}
  rustc_version:
    description: "Version of the selected toolchain's rustc"
    value: ${{ steps.audit.outputs.rustc_version }}
  audit_outcome:
    # yamllint disable-line rule:line-length
    description: "cargo-audit result: 'passed' or 'failed', even when permit_fail lets the step pass"
    # yamllint disable-line rule:line-length
    value: ${{ steps.audit.outputs.audit_outcome || steps.check.outputs.audit_outcome }}
  vulnerability_count:
    description: "Vulnerabilities cargo-audit found, after ignores"
    value: ${{ steps.audit.outputs.vulnerability_count }}
  warning_count:
    # yamllint disable-line rule:line-length
    description: "cargo-audit warnings (unmaintained, unsound, yanked), after ignores"
    value: ${{ steps.audit.outputs.warning_count }}
  vulnerability_ids:
    description: "Space-separated RUSTSEC IDs of the vulnerabilities found"
    value: ${{ steps.audit.outputs.vulnerability_ids }}
  report_path:
    description: "Absolute path to cargo-audit's JSON report, in artefact_path"
    value: ${{ steps.audit.outputs.report_path }}
  deny_report_path:
    # yamllint disable-line rule:line-length
    description: "Absolute path to cargo-deny's JSON lines output, in artefact_path; empty when cargo-deny did not run"
    value: ${{ steps.audit.outputs.deny_report_path }}
  artefact_path:
    description: "Absolute path to the directory holding the reports"
    value: ${{ steps.audit.outputs.artefact_path }}
  artefact_name:
    # yamllint disable-line rule:line-length
    description: "Name of the uploaded report artefact; empty when the action uploads nothing"
    value: ${{ steps.audit.outputs.artefact_name }}
  deny_outcome:
    description: "cargo-deny result: 'passed', 'failed' or 'skipped'"
    # yamllint disable-line rule:line-length
    value: ${{ steps.audit.outputs.deny_outcome || steps.check.outputs.deny_outcome }}

runs:
  using: "composite"
  steps:
    - name: "Check inputs"
      id: check
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
        INPUT_LOCKFILE_REQUIRED: ${{ inputs.lockfile_required }}
        INPUT_IGNORE_VULNS: ${{ inputs.ignore_vulns }}
        INPUT_ALLOW_LIST_PATH: ${{ inputs.allow_list_path }}
        INPUT_DENY_WARNINGS: ${{ inputs.deny_warnings }}
        INPUT_DENY_ENABLED: ${{ inputs.deny_enabled }}
        INPUT_DENY_CHECKS: ${{ inputs.deny_checks }}
        INPUT_CARGO_AUDIT_VERSION: ${{ inputs.cargo_audit_version }}
        INPUT_CARGO_DENY_VERSION: ${{ inputs.cargo_deny_version }}
        INPUT_PERMIT_FAIL: ${{ inputs.permit_fail }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_ARTEFACT_UPLOAD: ${{ inputs.artefact_upload }}
        INPUT_ARTEFACT_NAME: ${{ inputs.artefact_name }}
        INPUT_ARTEFACT_PATH: ${{ inputs.artefact_path }}
      run: bash "$ACTION_PATH/scripts/rust-audit.sh" check

    # Prebuilt, checksum-verified binaries only: no fallback to building
    # from source. An install failure always reaches the audit step,
    # which fails at the 'Install audit tools' stage (a warning under
    # permit_fail) without running any tool already on PATH.
    # continue-on-error must stay a literal: on a step that uses a
    # composite action, the runner evaluates it with that action's own
    # inputs, so an expression on inputs.permit_fail reads as false.
    # https://github.com/actions/runner/issues/2418
    - name: "Install audit tools"
      id: install
      # yamllint disable-line rule:line-length
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      continue-on-error: true
      with:
        tool: ${{ steps.check.outputs.tools }}
        fallback: none

    - name: "Audit dependencies"
      id: audit
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
        INPUT_LOCKFILE_REQUIRED: ${{ inputs.lockfile_required }}
        INPUT_IGNORE_VULNS: ${{ inputs.ignore_vulns }}
        INPUT_ALLOW_LIST_PATH: ${{ inputs.allow_list_path }}
        INPUT_DENY_WARNINGS: ${{ inputs.deny_warnings }}
        INPUT_DENY_ENABLED: ${{ inputs.deny_enabled }}
        INPUT_DENY_CHECKS: ${{ inputs.deny_checks }}
        INPUT_CARGO_AUDIT_VERSION: ${{ inputs.cargo_audit_version }}
        INPUT_CARGO_DENY_VERSION: ${{ inputs.cargo_deny_version }}
        INPUT_PERMIT_FAIL: ${{ inputs.permit_fail }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_ARTEFACT_UPLOAD: ${{ inputs.artefact_upload }}
        INPUT_ARTEFACT_NAME: ${{ inputs.artefact_name }}
        INPUT_ARTEFACT_PATH: ${{ inputs.artefact_path }}
      run: bash "$ACTION_PATH/scripts/rust-audit.sh" audit

    # Runs after a failed audit too, so the reports explain the failure.
    # upload_reports is 'true' only when artefact_upload is and a report
    # exists. Under permit_fail an upload failure (a duplicate name, a
    # service error) does not fail the action. Unlike the install step,
    # this uses a JavaScript action, whose handler leaves the inputs
    # context alone, so the expression reads this action's permit_fail;
    # testing.yaml proves both values.
    - name: "Upload audit reports"
      if: ${{ !cancelled() && steps.audit.outputs.upload_reports == 'true' }}
      # yamllint disable-line rule:line-length
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      continue-on-error: ${{ inputs.permit_fail == 'true' }}
      with:
        name: ${{ steps.audit.outputs.artefact_name }}
        path: ${{ steps.audit.outputs.artefact_path }}
        if-no-files-found: warn
        # The directory holds only this run's reports, so a hidden name
        # such as artefact_path '.audit' must not empty the artefact.
        include-hidden-files: true
